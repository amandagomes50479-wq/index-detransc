<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Cliques</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px 15px; }
        .painel { max-width: 540px; margin: auto; background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #2b542c; font-size: 20px; margin: 0; }
        button { background: #2b542c; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1e3d1f; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background: #e9f5e9; color: #2b542c; }
        tr.total-row td { background: #f9f9f9; font-weight: bold; border-top: 2px solid #2b542c; }
    </style>
</head>
<body>
    <div class="painel">
        <div class="topo">
            <h2>Contagem de Cliques</h2>
            <button onclick="carregarResultados()">Atualizar</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Botão</th>
                    <th>Cliques</th>
                </tr>
            </thead>
            <tbody id="tabela-cliques">
                <tr><td colspan="2">Carregando resultados...</td></tr>
            </tbody>
        </table>
    </div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const NAMESPACE = "detransc_painel_unico_99";
    const DESTINO_PADRAO = "https://www.detran.sc.gov.br/";
    const botoes = document.querySelectorAll(".card");

    botoes.forEach(function(botao) {
        // Já atualiza o href visual do botão para o site oficial
        botao.setAttribute("href", DESTINO_PADRAO);

        botao.addEventListener("click", function(e) {
            e.preventDefault(); // Aguarda o registro do clique antes de sair da página

            const texto = this.querySelector(".card-label").innerText;
            const chave = texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                               .toLowerCase().replace(/[^a-z0-9]/g, "_");

            // Registra +1 clique e imediatamente redireciona para https://www.detran.sc.gov.br/
            fetch(`https://jasoncameron.dev{NAMESPACE}/${chave}`)
                .finally(function() {
                    window.location.href = DESTINO_PADRAO;
                });
        });
    });
});
</script>

</body>
</html>
