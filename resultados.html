<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Cliques</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 40px 15px; }
        .painel { max-width: 560px; margin: auto; background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        h2 { color: #2b542c; font-size: 20px; margin: 0; }
        .botoes-acao { display: flex; gap: 8px; }
        button { color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-atualizar { background: #2b542c; }
        .btn-atualizar:hover { background: #1e3d1f; }
        .btn-apagar { background: #c81010; }
        .btn-apagar:hover { background: #9e0b0b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background: #e9f5e9; color: #2b542c; }
        tr.total-row td { background: #f9f9f9; font-weight: bold; border-top: 2px solid #2b542c; }
    </style>
</head>
<body>
    <div class="painel">
        <div class="topo">
            <h2>Contagem de Cliques</h2>
            <div class="botoes-acao">
                <button class="btn-atualizar" onclick="carregarResultados()">Atualizar</button>
                <button class="btn-apagar" onclick="apagarTudo()">Apagar Tudo</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Botão</th>
                    <th>Cliques</th>
                </tr>
            </thead>
            <tbody id="tabela-cliques">
                <tr><td colspan="2">Carregando resultados...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
    // COLE AQUI A NOVA URL GERADA NA NOVA IMPLANTAÇÃO DO GOOGLE
    const URL_PLANILHA = "https://script.google.com/macros/s/AKfycbwOzB4G7WVqxJs_Ea1XOCBG7rwYEbrXUe1GCXWZPXh9qqa5vrRoh61Pedb6UEF2zuwQaw/exec";

    const listaBotoes = [
        "Consulta Veículos",
        "Consulta CNH",
        "Consultar Infrações",
        "Estatísticas",
        "Detran Digital",
        "Emprego na Pista",
        "CFC Credenciado",
        "Instrutores Autônomos Credenciados"
    ];

    function receberDados(contagem) {
        const tbody = document.getElementById("tabela-cliques");
        let htmlLinhas = "";
        let somaTotal = 0;

        for (const nome of listaBotoes) {
            const total = contagem[nome] || 0;
            somaTotal += total;
            htmlLinhas += `<tr><td>${nome}</td><td><strong>${total}</strong></td></tr>`;
        }

        htmlLinhas += `<tr class="total-row"><td>TOTAL GERAL</td><td>${somaTotal}</td></tr>`;
        tbody.innerHTML = htmlLinhas;
    }

    function carregarResultados() {
        const tbody = document.getElementById("tabela-cliques");
        tbody.innerHTML = "<tr><td colspan='2'>Buscando dados...</td></tr>";

        const scriptAntigo = document.getElementById("script-google");
        if (scriptAntigo) scriptAntigo.remove();

        const script = document.createElement("script");
        script.id = "script-google";
        script.src = `${URL_PLANILHA}?callback=receberDados&t=${Date.now()}`;
        script.onerror = function() {
            tbody.innerHTML = "<tr><td colspan='2'>Erro ao conectar. Verifique se a implantação está como 'Qualquer pessoa'.</td></tr>";
        };
        document.body.appendChild(script);
    }

    function apagarTudo() {
        if (!confirm("Tem certeza que deseja zerar toda a contagem de cliques?")) {
            return;
        }

        const tbody = document.getElementById("tabela-cliques");
        tbody.innerHTML = "<tr><td colspan='2'>Apagando registros...</td></tr>";

        fetch(`${URL_PLANILHA}?acao=limpar`, { mode: "no-cors" })
            .then(function() {
                setTimeout(carregarResultados, 800);
            })
            .catch(function() {
                alert("Erro ao tentar apagar. Tente novamente.");
                carregarResultados();
            });
    }

    carregarResultados();
    </script>
</body>
</html>
