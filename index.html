<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Estadual de Trânsito de Santa Catarina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 10%;
            border-bottom: 1px solid #e0e0e0;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 15px;
            margin-right: 18px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #2b542c;
            border-radius: 1px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 500;
            color: #2b542c;
        }

        /* Faixa decorativa */
        .banner-strip {
            width: 100%;
            height: 22px;
            background: linear-gradient(90deg, #b8b8b8 0%, #7a7a7a 35%, #d6d6d6 60%, #4a4a4a 85%, #9e9e9e 100%);
            opacity: 0.75;
        }

        /* Conteúdo Principal */
        main {
            max-width: 1120px;
            width: 100%;
            margin: 48px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section-title {
            margin-bottom: 22px;
        }

        .section-title .sub {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #333333;
        }

        .section-title .main-text {
            display: block;
            font-size: 24px;
            font-weight: 800;
            color: #c81010;
        }

        /* Grade dos 5 Cards */
        .cards-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
        }

        .card {
            width: 205px;
            height: 160px;
            background-color: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 2px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: #333333;
            transition: transform 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16);
        }

        .card.highlight {
            background-color: #d9f3d9;
            border-color: #c6e8c6;
        }

        .card svg {
            width: 38px;
            height: 38px;
            margin-bottom: 16px;
            fill: #265c29;
        }

        .card-label {
            font-size: 13px;
            font-weight: 600;
            color: #2b2b2b;
            line-height: 1.3;
        }

        /* Rodapé */
        footer {
            width: 100%;
            background-color: #e6e6e6;
            padding: 36px 20px 50px;
            border-top: 1px solid #dcdcdc;
            margin-top: 40px;
        }

        .footer-container {
            max-width: 1120px;
            margin: 0 auto;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .sc-logo-top {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .sc-logo-top .red { color: #c81010; }
        .sc-logo-top .green { color: #265c29; }

        .social-icons {
            display: flex;
            gap: 8px;
        }

        .social-link {
            width: 30px;
            height: 30px;
            background-color: #8ea93b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-link svg {
            width: 15px;
            height: 15px;
            fill: #ffffff;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .footer-col h3 {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .detran-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .detran-brand-text {
            font-size: 15px;
            font-weight: 900;
            color: #111111;
        }

        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #363636;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 4px;
            width: 115px;
        }

        .store-btn svg {
            width: 12px;
            height: 12px;
            fill: #ffffff;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 6px;
        }

        .footer-links a {
            text-decoration: none;
            color: #333333;
            font-size: 12px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .info-block {
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.4;
        }

        .info-block strong {
            display: block;
            color: #222222;
        }

        .padrao-logo {
            margin-top: 10px;
            line-height: 1;
        }

        .padrao-logo small {
            font-size: 7px;
            color: #777777;
            font-weight: 700;
            display: block;
        }

        .padrao-logo .logo-txt {
            font-size: 18px;
            font-weight: 900;
        }

        .footer-bottom {
            margin-top: 28px;
            padding-top: 15px;
            border-top: 1px solid #d4d4d4;
            font-size: 12px;
        }

        .privacy-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #333333;
            margin-bottom: 10px;
        }

        .accessibility-float {
            position: fixed;
            right: 10px;
            top: 35%;
            width: 38px;
            height: 38px;
            background-color: #2a7de1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            cursor: pointer;
        }

        .accessibility-float svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
    </style>
</head>
