<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Estadual de Trânsito de Santa Catarina</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 11%;
            border-bottom: 1px solid #e0e0e0;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 15px;
            margin-right: 18px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #2b542c;
            border-radius: 1px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 500;
            color: #2b542c;
            letter-spacing: -0.3px;
        }

        /* Faixa decorativa abaixo do header */
        .banner-strip {
            width: 100%;
            height: 24px;
            background: linear-gradient(90deg, #b8b8b8 0%, #7a7a7a 35%, #d6d6d6 60%, #4a4a4a 85%, #9e9e9e 100%);
            opacity: 0.75;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Conteúdo Principal */
        main {
            max-width: 1120px;
            width: 100%;
            margin: 48px auto 70px;
            padding: 0 20px;
            flex: 1;
        }

        .section-title {
            margin-bottom: 22px;
        }

        .section-title .sub {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #333333;
            line-height: 1.1;
        }

        .section-title .main-text {
            display: block;
            font-size: 24px;
            font-weight: 800;
            color: #c81010;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        /* Grade dos 5 Cards */
        .cards-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
        }

        .card {
            width: 205px;
            height: 162px;
            background-color: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 2px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: #333333;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16);
        }

        .card.highlight {
            background-color: #d9f3d9;
            border-color: #c6e8c6;
        }

        .card svg {
            width: 38px;
            height: 38px;
            margin-bottom: 16px;
            fill: #265c29;
        }

        .card-label {
            font-size: 13px;
            font-weight: 500;
            color: #2b2b2b;
            line-height: 1.3;
        }

        /* ================= RODAPÉ EXATO DA IMAGEM ================= */
        footer {
            width: 100%;
            background-color: #e6e6e6;
            padding: 32px 20px 45px;
            border-top: 1px solid #dcdcdc;
            position: relative;
        }

        .footer-container {
            max-width: 1120px;
            margin: 0 auto;
        }

        /* Linha superior do rodapé: sc.gov.br à esquerda e ícones verdes à direita */
        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .sc-logo-top {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1.8px;
            line-height: 1;
        }

        .sc-logo-top .red {
            color: #c81010;
        }

        .sc-logo-top .green {
            color: #265c29;
        }

        .social-icons {
            display: flex;
            gap: 8px;
            margin-right: 190px;
        }

        .social-link {
            width: 30px;
            height: 30px;
            background-color: #8ea93b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-link:hover {
            opacity: 0.85;
        }

        .social-link svg {
            width: 15px;
            height: 15px;
            fill: #ffffff;
        }

        /* Grade das 5 Colunas do Rodapé */
        .footer-grid {
            display: grid;
            grid-template-columns: 1.05fr 1.15fr 1.85fr 1.65fr 1.55fr;
            gap: 18px;
            align-items: start;
        }

        .footer-col h3 {
            font-size: 12px;
            font-weight: 700;
            color: #222222;
            text-transform: uppercase;
            margin-bottom: 14px;
            letter-spacing: 0.2px;
        }

        /* Coluna 1: DETRANSC + Botões das lojas */
        .detran-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }

        .detran-brand-text {
            font-size: 14px;
            font-weight: 900;
            color: #111111;
            letter-spacing: -0.3px;
        }

        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #363636;
            color: #ffffff;
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 4px;
            width: 112px;
            transition: background-color 0.2s;
        }

        .store-btn:hover {
            background-color: #1f1f1f;
        }

        .store-btn svg {
            width: 12px;
            height: 12px;
            fill: #ffffff;
        }

        /* Coluna 2: Links Externos */
        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 6px;
        }

        .footer-links a {
            text-decoration: none;
            color: #333333;
            font-size: 12px;
            font-weight: 400;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Coluna 3 e 4: Fale Conosco e Endereço */
        .info-block {
            margin-bottom: 14px;
            font-size: 12px;
            line-height: 1.35;
            color: #333333;
        }

        .info-block strong {
            display: block;
            font-weight: 700;
            color: #222222;
        }

        .address-bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
        }

        .padrao-logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
            position: relative;
        }

        .padrao-logo small {
            font-size: 7px;
            color: #999999;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
        }

        .padrao-logo .logo-txt {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -1.2px;
            display: flex;
            align-items: center;
        }

        .leaf-badge {
            display: inline-block;
            width: 10px;
            height: 12px;
            margin-left: 2px;
        }

        /* Coluna 5: Localização e Mapa */
        .location-col {
            text-align: center;
        }

        .map-wrapper {
            margin-top: -6px;
            display: flex;
            justify-content: center;
        }

        /* Parte inferior: Política de Privacidade e Copyright */
        .footer-bottom {
            margin-top: 20px;
            font-size: 11.5px;
            color: #333333;
        }

        .privacy-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #333333;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .privacy-link:hover {
            text-decoration: underline;
        }

        .copyright {
            font-size: 11.5px;
            color: #333333;
        }

        .copyright strong {
            font-weight: 700;
        }

        /* Botão Azul de Acessibilidade à direita */
        .accessibility-float {
            position: fixed;
            right: 8px;
            bottom: 185px;
            width: 38px;
            height: 38px;
            background-color: #2a7de1;
            border-radius: 6px;
            display: flex;
