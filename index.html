<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamento Estadual de Trânsito de Santa Catarina</title>
    <!-- Fonte Montserrat/Open Sans para fidelidade visual -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
        }

        /* Cabeçalho */
        header {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            padding: 0 11%;
            border-bottom: 1px solid #e0e0e0;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 20px;
            height: 15px;
            margin-right: 18px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 3px;
            width: 100%;
            background-color: #2b542c;
            border-radius: 1px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 500;
            color: #2b542c;
            letter-spacing: -0.3px;
        }

        /* Faixa de imagem decorativa abaixo do header */
        .banner-strip {
            width: 100%;
            height: 24px;
            background: linear-gradient(90deg, #b8b8b8 0%, #7a7a7a 35%, #d6d6d6 60%, #4a4a4a 85%, #9e9e9e 100%);
            opacity: 0.75;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Container Principal */
        main {
            max-width: 1120px;
            margin: 48px auto;
            padding: 0 20px;
        }

        /* Título da Seção */
        .section-title {
            margin-bottom: 22px;
        }

        .section-title .sub {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #333333;
            line-height: 1.1;
        }

        .section-title .main-text {
            display: block;
            font-size: 24px;
            font-weight: 800;
            color: #c81010;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        /* Organização dos Cards */
        .cards-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .cards-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
        }

        .card {
            width: 208px;
            height: 162px;
            background-color: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 2px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: #333333;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16);
        }

        /* Card destacado em verde claro */
        .card.highlight {
            background-color: #d9f3d9;
            border-color: #c6e8c6;
        }

        .card svg {
            width: 38px;
            height: 38px;
            margin-bottom: 16px;
            fill: #265c29;
        }

        .card-label {
            font-size: 13px;
            font-weight: 500;
            color: #2b2b2b;
            line-height: 1.3;
        }

        /* Responsividade para telas menores */
        @media (max-width: 1120px) {
            .card {
                width: 185px;
                height: 150px;
            }
        }

        @media (max-width: 650px) {
            header {
                padding: 0 20px;
            }
            .header-title {
                font-size: 16px;
            }
            .card {
                width: 46%;
            }
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Superior -->
    <header>
        <div class="menu-icon" title="Menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <h1 class="header-title">Departamento Estadual de Trânsito de Santa Catarina</h1>
    </header>

    <!-- Faixa Cinza Estilizada -->
    <div class="banner-strip"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="section-title">
            <span class="sub">Serviços mais</span>
            <span class="main-text">ACESSADOS</span>
        </div>

        <div class="cards-wrapper">
            <!-- Primeira Linha: 5 Cards -->
            <div class="cards-row">
                <!-- 1. Consulta Veículos -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.08 3.11H5.77L6.85 7zM19 17H5v-5h14v5z"/>
                        <circle cx="7.5" cy="14.5" r="1.5"/>
                        <circle cx="16.5" cy="14.5" r="1.5"/>
                    </svg>
                    <span class="card-label">Consulta Veículos</span>
                </a>

                <!-- 2. Consulta CNH -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/>

                        <rect x="13" y="13.5" width="5" height="1.2"/>
                        <rect x="13" y="16" width="3.5" height="1.2"/>
                    </svg>
                    <span class="card-label">Consulta CNH</span>
                </a>

                <!-- 3. Consultar Infrações -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h7v-2H6V4h7v5h5v4h2V8l-6-6z"/>
                        <circle cx="8.5" cy="12.5" r="1"/>
                        <circle cx="8.5" cy="15" r="1"/>
                        <circle cx="8.5" cy="17.5" r="1"/>
                        <rect x="10.5" y="12" width="4.5" height="1"/>
                        <rect x="10.5" y="14.5" width="4.5" height="1"/>
                        <rect x="10.5" y="17" width="3" height="1"/>
                        <text x="15.5" y="21" font-size="9" font-weight="bold" fill="#265c29">$</text>
                    </svg>
                    <span class="card-label">Consultar Infrações</span>
                </a>

                <!-- 4. Estatísticas -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M9.5 4h-2L5 11.5C4.4 12.3 4 13.3 4 14.5 4 17 6 19 8.5 19c2.2 0 4-1.6 4.4-3.7h.2c.4 2.1 2.2 3.7 4.4 3.7 2.5 0 4.5-2 4.5-4.5 0-1.2-.4-2.2-1-3L18.5 4h-2l-1.5 5h-4L9.5 4zm-1 13C7.1 17 6 15.9 6 14.5S7.1 12 8.5 12s2.5 1.1 2.5 2.5S9.9 17 8.5 17zm9 0c-1.4 0-2.5-1.1-2.5-2.5s1.1-2.5 2.5-2.5 2.5 1.1 2.5 2.5-1.1 2.5-2.5 2.5z"/>
                    </svg>
                    <span class="card-label">Estatísticas</span>
                </a>

                <!-- 5. Detran Digital (Destacado em Verde Claro) -->
                <a href="#" class="card highlight">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="3"/>
                        <circle cx="6.5" cy="9.5" r="2.2"/>
                        <circle cx="17.5" cy="9.5" r="2.2"/>
                        <path d="M12 12.5c-2.7 0-5.5 1.3-5.5 3.5v2h11v-2c0-2.2-2.8-3.5-5.5-3.5z"/>
                        <path d="M5.5 13.5c-1.8 0-3.5.9-3.5 2.3V17h3.2v-1c0-1 .5-1.8 1.3-2.4-.3-.1-.7-.1-1-.1z"/>
                        <path d="M18.5 13.5c-.3 0-.7 0-1 .1.8.6 1.3 1.4 1.3 2.4v1H22v-1.2c0-1.4-1.7-2.3-3.5-2.3z"/>
                    </svg>
                    <span class="card-label">Detran Digital</span>
                </a>
            </div>

            <!-- Segunda Linha: 3 Cards Centralizados -->
            <div class="cards-row">
                <!-- 6. Emprego na Pista -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 6h16v3H4V6zm6 11H5v-6h5v6zm9 0h-7v-1.5h7V17zm0-3h-7v-1.5h7V14z"/>
                    </svg>
                    <span class="card-label">Emprego na Pista</span>
                </a>

                <!-- 7. CFC Credenciado -->
                <a href="#" class="card">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM8.5 8.5c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm4 7.5h-8v-1c0-1.3 2.7-2 4-2s4 .7 4 2v1zm6.5-1h-5v-1.3h5V15zm0-2.5h-5v-1.3h5v1.3zm0-2.5h-5V8.7h5V10z"/>
                    </svg>
